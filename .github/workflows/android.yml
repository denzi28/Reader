# Builds the Android app (a Trusted Web Activity around https://www.leafpage.app).
# Run it by hand: Actions > Android app > Run workflow.
#   variant "dev":     a test app (package app.leafpage.reader.dev, called "Leafpage Dev") signed with a throwaway key made here,
#                      to install on a phone and try. It needs no secrets and never touches the Google Play app.
#   variant "release": the signed bundle for Google Play. It needs the repository secrets ANDROID_KEYSTORE_B64, ANDROID_KEYSTORE_PASSWORD,
#                      ANDROID_KEY_PASSWORD and, if the key's alias is not "upload", ANDROID_KEY_ALIAS (see android/README.md).
name: Android app

on:
  workflow_dispatch:
    inputs:
      variant:
        description: 'dev = a test app to install on a phone; release = the bundle for Google Play'
        type: choice
        options: [dev, release]
        default: dev
      version_name:
        description: 'Version name shown to people (for example 1.0.0)'
        default: '1.0.0'

jobs:
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }

      # The Android SDK the way Bubblewrap makes it itself: with the same (old) command line tools it downloads, because the
      # newest tools write platform files that this Android Gradle plugin does not recognise ("Failed to find target ... android-36").
      - name: Android SDK, set up the way Bubblewrap does it
        run: |
          SDK="$HOME/android-sdk"
          mkdir -p "$SDK" ~/.bubblewrap
          curl -fsSL -o "$RUNNER_TEMP/clt.zip" https://dl.google.com/android/repository/commandlinetools-linux-6609375_latest.zip
          unzip -q "$RUNNER_TEMP/clt.zip" -d "$SDK"
          yes | "$SDK/tools/bin/sdkmanager" --licenses --sdk_root="$SDK" > /dev/null || true
          yes | "$SDK/tools/bin/sdkmanager" --sdk_root="$SDK" "build-tools;36.1.0"
          ls "$SDK" "$SDK/build-tools"
          cat > ~/.bubblewrap/config.json <<JSON
          { "jdkPath": "$JAVA_HOME", "androidSdkPath": "$SDK" }
          JSON
          cat ~/.bubblewrap/config.json
          # Gradle refuses to build when ANDROID_HOME and ANDROID_SDK_ROOT name different folders.
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"

      # ---- the key ------------------------------------------------------------------------------
      - name: Upload key (release)
        if: inputs.variant == 'release'
        working-directory: android
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: echo "$KEYSTORE_B64" | base64 -d > upload.keystore

      # The test app's key is made once and kept, so its fingerprint (put in assetlinks.json) stays the same run after run.
      - name: Test key (dev), kept between runs
        if: inputs.variant == 'dev'
        id: devkey
        uses: actions/cache@v4
        with:
          path: android/dev.keystore
          key: leafpage-dev-keystore-v1

      - name: Test key (dev), made when there is none yet
        if: inputs.variant == 'dev' && steps.devkey.outputs.cache-hit != 'true'
        working-directory: android
        run: |
          keytool -genkeypair -noprompt -keystore dev.keystore -alias dev -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass leafpage-dev -keypass leafpage-dev -dname "CN=Leafpage Dev, O=Leafpage"

      # ---- what is built ---------------------------------------------------------------------------
      - name: Version, and the test app's own name and key
        working-directory: android
        env:
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          node -e "
            const f='twa-manifest.json', m=JSON.parse(require('fs').readFileSync(f,'utf8'));
            m.appVersionName='${{ inputs.version_name }}'; m.appVersion=String(process.env.GITHUB_RUN_NUMBER); m.appVersionCode=Number(process.env.GITHUB_RUN_NUMBER);
            // The upload key made by PWABuilder has its own alias (often my-key-alias): ANDROID_KEY_ALIAS says which.
            if ('${{ inputs.variant }}'==='release' && process.env.KEY_ALIAS) m.signingKey.alias=process.env.KEY_ALIAS;
            if ('${{ inputs.variant }}'==='dev') {
              m.packageId='app.leafpage.reader.dev'; m.name='Leafpage Dev'; m.launcherName='Leafpage Dev';
              m.signingKey={ path: './dev.keystore', alias: 'dev' };
            }
            require('fs').writeFileSync(f, JSON.stringify(m,null,2));"

      - name: Build
        working-directory: android
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ inputs.variant == 'dev' && 'leafpage-dev' || secrets.ANDROID_KEYSTORE_PASSWORD }}
          BUBBLEWRAP_KEY_PASSWORD: ${{ inputs.variant == 'dev' && 'leafpage-dev' || secrets.ANDROID_KEY_PASSWORD }}
        run: |
          npx --yes @bubblewrap/cli@1.27.0 update --manifest=./twa-manifest.json --skipVersionUpgrade
          # "Open with Leafpage" for PDF and ePub files: Bubblewrap does not add that filter itself.
          node add-file-intents.mjs
          # The Android Gradle plugin Bubblewrap pins (8.9.1) does not recognise the current Android 16 platform ("Failed to find
          # target with hash string 'android-36'"), so the generated project gets a newer plugin and the Gradle it needs.
          sed -i "s#com.android.tools.build:gradle:8.9.1#com.android.tools.build:gradle:8.13.0#" build.gradle
          sed -i "s#gradle-8.11.1-bin.zip#gradle-8.13-bin.zip#" gradle/wrapper/gradle-wrapper.properties
          grep -n "com.android.tools.build:gradle" build.gradle
          grep -n "distributionUrl" gradle/wrapper/gradle-wrapper.properties
          # `update` takes the app's name from the web manifest again; the test app keeps its own name so the two can be told apart.
          if [ "${{ inputs.variant }}" = "dev" ]; then
            sed -i "s/^    name: .*/    name: 'Leafpage Dev',/; s/^    launcherName: .*/    launcherName: 'Leafpage Dev',/" app/build.gradle
            grep -n "applicationId:\|    name:\|launcherName:" app/build.gradle
          fi
          npx --yes @bubblewrap/cli@1.27.0 build --manifest=./twa-manifest.json --skipPwaValidation

      - name: What went wrong, in short (shown when the build failed)
        if: failure()
        working-directory: android
        run: |
          ./gradlew assembleRelease --console=plain 2>&1 | grep -E "What went wrong|^> |^Caused by|Manifest merger|error:|FAILED" | head -25 || true

      - name: What the Android SDK holds (shown when the build failed)
        if: failure()
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME  ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          ls "$HOME/android-sdk" "$HOME/android-sdk/platforms" "$HOME/android-sdk/build-tools" 2>&1 | head -30
          for d in "$HOME"/android-sdk/platforms/*; do echo "== $d"; grep -E "AndroidVersion|Pkg.Desc|Pkg.Revision" "$d/source.properties" 2>&1; done

      - name: The key's fingerprint (for assetlinks.json)
        if: inputs.variant == 'dev'
        working-directory: android
        run: |
          keytool -list -v -keystore dev.keystore -alias dev -storepass leafpage-dev | grep -E "SHA256:" | tee fingerprint.txt
          { echo "### Test app key"; echo; echo "Package: app.leafpage.reader.dev"; echo; echo '```'; cat fingerprint.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: leafpage-android-${{ inputs.variant }}
          path: |
            android/app-release-bundle.aab
            android/app-release-signed.apk
            android/assetlinks.json
            android/fingerprint.txt
